name: Web deployments

on:
  push:
    branches:
      - v2
  workflow_dispatch:

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  edgeone:
    name: Deploy to EdgeOne Makers
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install EdgeOne CLI
        run: npm install --global --registry=https://registry.npmjs.org edgeone@1.6.28

      - name: Build and deploy
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT_NAME: ${{ secrets.EDGEONE_PROJECT_NAME }}
        run: edgeone makers deploy -n "$EDGEONE_PROJECT_NAME" -t "$EDGEONE_API_TOKEN" -e production

  netlify:
    name: Deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install web dependencies
        run: yarn install --frozen-lockfile

      - name: Build Netlify bundle
        run: yarn build:netlify

      - name: Install Netlify CLI
        run: npm install --global --registry=https://registry.npmjs.org netlify-cli@23

      - name: Deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: netlify deploy --prod --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN"
