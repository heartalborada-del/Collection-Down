edition: 3.0.0
name: Collection-Down
access: 'default'
vars:
  region: 'cn-hongkong'
  functionName: 'Collection-Down'
resources:
  build&start:
    component: fc3
    actions:
      pre-deploy:
        - run: wget "https://mirrors.aliyun.com/nodejs-release/v22.16.0/node-v22.16.0-linux-x64.tar.xz" -O "node-v22.16.0-linux-x64.tar.xz" && tar -xf "node-v22.16.0-linux-x64.tar.xz" && rm "node-v22.16.0-linux-x64.tar.xz"
          path: /usr/local/versions/node
        - run: mv /usr/local/versions/node/node-v22.16.0-linux-x64 /usr/local/versions/node/v22.16.0
          path: /usr/local/versions/node
        - run: export PATH=/usr/local/versions/node/v22.16.0/bin && corepack enable
        - run: export PATH=/usr/local/versions/node/v22.16.0/bin && yarn install
        - run: export PATH=/usr/local/versions/node/v22.16.0/bin && yarn run build
    props:
      region: ${vars.region}
      description: Serverless Devs Web Framework Function
      runtime: custom.debian12
      layers:
        - acs:fc:${vars.region}:official:layers/Nodejs22/versions/1
      environmentVariables:
        PATH: >-
          /opt/nodejs22/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/bin
      timeout: 60
      service:
        name: fc-collection-down
        internetAccess: true
        logConfig:
          project: collection-down
          logstore: collection-down
          enableRequestMetrics: true
          enableInstanceMetrics: true
          logBeginRule: DefaultRegex
      customRuntimeConfig:
        command:
          - node
          - .output/server/index.mjs
        port: 3000
      functionName: ${vars.functionName}
      code: ./
  public:
    component: fc3-domain
    props:
      region: ${vars.region}
      domainName: auto
      protocol: HTTP
      routeConfig:
        routes:
          - path: /*
            functionName: ${vars.functionName}